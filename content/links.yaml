# Useful websites, grouped by category.
# Fields: title, url, category, description (what the site is), note (optional: what I found there), guide (optional: related guide slug)
- category: Developer tools
  items:
    - title: Oh My Zsh
      url: https://ohmyz.sh/
      description: Framework for managing Zsh configuration with hundreds of plugins and themes.
      note: The base of my terminal setup; the plugins I use are listed in the Zsh guide.
      guide: zsh
    - title: Powerlevel10k
      url: https://github.com/romkatv/powerlevel10k
      description: Fast and highly configurable Zsh theme.
      guide: zsh
    - title: zsh-autosuggestions
      url: https://github.com/zsh-users/zsh-autosuggestions
      description: Fish-like command suggestions for Zsh based on history and completions.
      guide: zsh
    - title: mkcert
      url: https://github.com/FiloSottile/mkcert
      description: Zero-config tool for locally trusted development HTTPS certificates.
      guide: traefik
    - title: Traefik Proxy
      url: https://traefik.io/traefik/
      description: Reverse proxy that routes traffic to Docker containers by host name.
      guide: traefik
    - title: Dockerizer
      url: https://github.com/zagovorichev/dockerizer
      description: My example setup of Traefik + Portainer + WhoAmI for local Docker development.
      guide: traefik

- category: Process & methodology
  items:
    - title: The Scrum Guide
      url: https://scrumguides.org/scrum-guide.html
      description: The official definition of Scrum from its creators.
      guide: sdlc

